production:
  # Every 3 hours in Lisbon time, the app's time zone, so one run lands just
  # after midnight and a restart around then can't leave a salt for a whole day
  delete_old_visitor_salts:
    class: DeleteOldVisitorSaltsJob
    schedule: "1 */3 * * * Europe/Lisbon"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
